services:
  - type: web
    name: deccanailabs
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: https://deccanailabs.com,https://www.deccanailabs.com
      - key: SITE_URL
        value: https://deccanailabs.com
      - key: ADMIN_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "DECCAN AI Labs <certificates@deccanailabs.com>"
      - key: MAIL_REPLY_TO
        value: careers@deccanailabs.com
